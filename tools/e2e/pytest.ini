# pytest configuration for the stratum_ui e2e suite (design sections 6, 7, 12). The plugins load by `-p`, which imports
# before `pythonpath` applies, so the `tools/e2e/round` wrapper (and any direct run) sets PYTHONPATH=tools/e2e.
[pytest]
pythonpath = .
addopts = -p pytester -p stratum_e2e.round.plugin -p stratum_e2e.cli_options -p stratum_e2e.device_fixtures -m "not level2_host and not perf" --strict-markers
testpaths = unit
markers =
    android: runs on the Android platform leg
    ios: runs on the iOS platform leg
    macos: runs on the macOS platform leg
    web: runs on the web platform leg
    level1: level 1 - the OS accessibility tree (design section 6)
    level2: level 2 - the real screen reader on the e2e AVD (design section 6)
    level2_host: level 2 with host VoiceOver; owner command only, never a default round (ruling O1)
    talkback_avd: needs the dedicated AVD E2E_TalkBack_API_35 (ruling Q3)
    stylus_avd: needs the dedicated AVD E2E_Stylus_API_36 (ruling Q3 amendment, 2026-10-27)
    req(tag): cites a TRACE-TEST requirement tag <feature>/us<NN>/fr<NN>[/e<NN>] or <feature>/us<NN>/s<N> (design section 12)
    perf: the example app's ABBA perf run (dart run tools/perf_abba.dart), mac only, outside default runs (C7)
