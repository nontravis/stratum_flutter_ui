typography:
  fonts:                         # font key: physical family plus its own tuning
    inter:       { family: "Google/Inter" }
    geist:       { family: "Google/Geist" }
    geist-mono:  { family: "Google/Geist Mono" }
    roboto-mono: { family: "Google/Roboto Mono" }
    kanit:       { family: "Google/Kanit" }

  families:                      # per locale tag: type to font key
    default:
      header: inter
      paragraph: inter
      body: inter
      table: inter                # table reads body's metrics; the family is its own
      number: { font: geist, mono: geist-mono }
      code: roboto-mono
      mono: roboto-mono          # theme-wide mono for types without their own
    th:                          # Thai prose; number and code keep their Latin fonts
      header: kanit
      paragraph: kanit
      body: kanit
      table: kanit

  scaleByWindowSize: { watch: 0, mobile: 0, tablet: 0.5, desktop: 1, bigDesktop: 2 }

  types:
    header:
      weight: 600
      sizes:
        s56: { spaceHeight: 16, letterSpacing: "-2.4%" }
        s36: { spaceHeight: 12, letterSpacing: "-2%" }
        s24: { spaceHeight: 10, letterSpacing: "-1.4%" }
        s20: { spaceHeight: 8,  letterSpacing: "-1.2%" }
        s18: { spaceHeight: 6,  letterSpacing: "-1%" }
        s14: { spaceHeight: 6,  letterSpacing: "0.6%" }
        s12: { spaceHeight: 8,  letterSpacing: "1.8%" }
    paragraph:
      weight: 400
      sizes:
        s20: { spaceHeight: 12, letterSpacing: "-1%" }
        s18: { spaceHeight: 12, letterSpacing: "-1%" }
        s16: { spaceHeight: 10, letterSpacing: "0%" }
        s14: { spaceHeight: 10, letterSpacing: "0.2%" }
    body:
      weight: 400
      sizes:
        s18: { spaceHeight: 10, letterSpacing: "-1%" }
        s16: { spaceHeight: 8,  letterSpacing: "-1%" }
        s14: { spaceHeight: 10, letterSpacing: "-0.6%" }
        s12: { spaceHeight: 4,  letterSpacing: "0.5%" }
        s10: { spaceHeight: 6,  letterSpacing: "0.8%" }
    number:
      weight: 600
      sizes:
        s36: { spaceHeight: 12 }
        s24: { spaceHeight: 8 }
        s18: { spaceHeight: 6 }
        s16: { spaceHeight: 8 }
        s14: { spaceHeight: 10 }
        s12: { spaceHeight: 4 }
        s10: { spaceHeight: 6 }
    code:
      weight: 400
      sizes:
        s18: { spaceHeight: 6 }
        s16: { spaceHeight: 8 }
        s14: { spaceHeight: 10 }
        s12: { spaceHeight: 4 }

animation:
  duration:
    default: fast            # the level animation.defaultStyle takes
    micro: 30                # milliseconds
    veryFast: 75
    fast: 125
    normal: 200
    slow: 300
    verySlow: 400
  reverseDuration: 64%       # reverse = forward x 64%: fast 125 ms gives 80 ms
  transition:                # a page transition type for each window size (FO-05 US-05 FR-04)
    watch: platform          # platform: Flutter's own page motion for the platform
    mobile: platform
    tablet: platform
    desktop: platform
    bigDesktop: platform
  curve:                     # a Flutter Curves name, or "cubic(a, b, c, d)" as Figma and CSS write it
    standard: easeInOutSine  # forward and reverse of every level
    enter: easeOut           # forward of animation.appear
    exit: easeIn             # reverse of animation.appear

extensions: {}
