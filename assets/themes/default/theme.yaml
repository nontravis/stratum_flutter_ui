$schema: stratum-theme/v1.0.0
name: stratum-default

assets:
  splash-screen:
  loading:

space:
  mobile-space: 16
  mobile-space-half: 8
  desktop-space: 32
  desktop-space-half: 16
  zero: 0
  5xs: 2
  4xs: 4
  3xs: 6
  2xs: 8
  xs: 10
  sm: 12
  md: 16
  lg: 20
  xl: 24
  2xl: 28
  3xl: 32
  4xl: 40
  5xl: 48
  6xl: 56
  7xl: 64
  8xl: 80
  9xl: 96
  10xl: 128
  11xl: 160
  12xl: 192
  13xl: 224
  14xl: 256

radius:
  full: 999
  card-large: 24
  card-medium: 20
  card-small: 16
  zero: 0
  2xs: 4
  xs: 6
  sm: 8
  md: 10
  lg: 12
  xl: 14
  2xl: 16
  3xl: 20
  4xl: 24
  5xl: 32
  ios: 42

layouts:
  max-width-content: 1000
  max-width-read: 720

color:
  light:
    brand:
      primary:
        normal: #FFFFFF
        hover: #FFFFFF
        active: #FFFFFF
        text: #FFFFFF
        icon: #FFFFFF
      secondary:
        normal: #FFFFFF
        hover: #FFFFFF
        active: #FFFFFF
        text: #FFFFFF
        icon: #FFFFFF
      tertiary:
        normal: #FFFFFF
        hover: #FFFFFF
        active: #FFFFFF
        text: #FFFFFF
        icon: #FFFFFF
      accent:
        normal: #FFFFFF
        hover: #FFFFFF
        active: #FFFFFF
        text: #FFFFFF
        icon: #FFFFFF
    text:
      default:
        primary: #FFFFFF
        primary-on-color: #FFFFFF
        primary-inverse: #FFFFFF
        secondary: #FFFFFF
        secondary-inverse: #FFFFFF
        tertiary: #FFFFFF
        tertiary-inverse: #FFFFFF
      color:
        brand:
        red:
        pink:
        rose:
        violet:
        purple:
        indigo:
        blue:
        cyan:
        teal:
        emerald:
        green:
        moss:
        lime:
        yellow:
        amber:
        orange:
        brown:
        blueGray:
        gray:
    icon:
      default:
      color:
    border:
      default:
      control:
      color:
      subtle:
    button:
      primary:
      secondary:
      shaded:
      destructive:
      filled:
    background:
      default:
      color:
      muted:
      subtle:
      surface:
      control:
    state:
    shadow:

  dark:

typography:
  fonts:                         # font key: physical family plus its own tuning
    inter:       { family: Inter }
    geist:       { family: Geist }
    geist-mono:  { family: Geist Mono }
    roboto-mono: { family: Roboto Mono }

  families:                      # per locale tag: type to font key
    default:
      header: inter
      paragraph: inter
      body: inter
      number: { font: geist, mono: geist-mono }
      code: roboto-mono
      mono: roboto-mono          # theme-wide mono for types without their own

  scaleByWindowSize: { watch: 0, mobile: 0, tablet: 0.5, desktop: 1, bigDesktop: 2 }

  types:
    header:
      weight: 600
      sizes:
        s56: { spaceHeight: 16, letterSpacing: "-2.4%" }
        s36: { spaceHeight: 12, letterSpacing: "-2%" }
        s24: { spaceHeight: 10, letterSpacing: "-1.4%" }
        s20: { spaceHeight: 8,  letterSpacing: "-1.2%" }
        s18: { spaceHeight: 6,  letterSpacing: "-1%" }
        s14: { spaceHeight: 6,  letterSpacing: "0.6%" }
        s12: { spaceHeight: 8,  letterSpacing: "1.8%" }
    paragraph:
      weight: 400
      sizes:
        s20: { spaceHeight: 12, letterSpacing: "-1%" }
        s18: { spaceHeight: 12, letterSpacing: "-1%" }
        s16: { spaceHeight: 10, letterSpacing: "0%" }
        s14: { spaceHeight: 10, letterSpacing: "0.2%" }
    body:
      weight: 400
      sizes:
        s18: { spaceHeight: 10, letterSpacing: "-1%" }
        s16: { spaceHeight: 8,  letterSpacing: "-1%" }
        s14: { spaceHeight: 10, letterSpacing: "-0.6%" }
        s12: { spaceHeight: 4,  letterSpacing: "0.5%" }
        s10: { spaceHeight: 6,  letterSpacing: "0.8%" }
    number:
      weight: 600
      sizes:
        s36: { spaceHeight: 12 }
        s24: { spaceHeight: 8 }
        s18: { spaceHeight: 6 }
        s16: { spaceHeight: 8 }
        s14: { spaceHeight: 10 }
        s12: { spaceHeight: 4 }
        s10: { spaceHeight: 6 }
    code:
      weight: 400
      sizes:
        s18: { spaceHeight: 6 }
        s16: { spaceHeight: 8 }
        s14: { spaceHeight: 10 }
        s12: { spaceHeight: 4 }
    table:
      extends: body
      tabular: true

