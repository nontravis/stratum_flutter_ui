name: stratum_ui
description: "Stratum UI design system"
version: 1.0.0
homepage:

environment:
  sdk: ^3.13.3
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_falmodel:
    git:
      url: https://github.com/Nextzy/flutter-falconx
      ref: 4.1.0
      path: flutter_falmodel
  flutter_falconx:
    git:
      url: https://github.com/Nextzy/flutter-falconx
      ref: 4.1.0
      path: flutter_falconx
  country_flags: ^4.1.2
  measure_size: ^5.0.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  badges: ^4.0.1
  yaml: ^3.1.4
  extended_image: ^10.1.0
  flutter_animate: ^4.5.2
  flutter_svg: ^2.3.0
  gap: ^3.0.1
  path: ^1.9.1
  smooth_page_indicator: ^3.0.0
  act_thumbhash: ^1.1.0
  web: ^1.1.1
  webview_all_linux: ^1.4.3
  webview_all_windows: ^1.4.3
  webview_flutter: ^4.14.1
  webview_platform_interface: ^1.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.1
  fake_async: ^1.3.3
  freezed: ^4.0.2
  very_good_analysis: ^11.0.0
  webview_flutter_platform_interface: ^2.15.1

flutter_gen:
  output: lib/generated/
  line_length: 120

  integrations:
    flutter_svg: true
    lottie: true

  assets:
    enabled: true
    outputs:
      package_parameter_enabled: true
      style: dot-delimiter
      class_name: Assets

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/fonts/
