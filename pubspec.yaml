name: stratum_ui
description: "Stratum UI design system"
version: 1.0.0
homepage:

environment:
  sdk: ^3.13.3
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  country_flags: ^4.1.2
  measure_size: ^5.0.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  badges: ^4.0.1
  yaml: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.1
  fake_async: ^1.3.3
  freezed: ^4.0.2
  very_good_analysis: ^11.0.0

flutter_gen:
  output: lib/generated/
  line_length: 120

  integrations:
    flutter_svg: true
    lottie: true

  assets:
    enabled: true
    outputs:
      package_parameter_enabled: true
      style: dot-delimiter
      class_name: Assets

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/fonts/
